[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deporank"
version = "1.0.0"
description = "Term deposit campaign analysis and contact prioritization"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.6,<2",
  "streamlit>=1.41,<2", "plotly>=5.24,<7", "joblib>=1.4,<2",
  "PyYAML>=6,<7", "pydantic>=2,<3", "matplotlib>=3.9,<4",
  "psutil>=6,<8", "reportlab>=4,<5", "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
bank-marketing = "bank_marketing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
